spring:
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  # Never reached: nightgals.mail.enabled is false below, so nothing is sent.
  # The host still has to parse, because JavaMailSender is autoconfigured.
  mail:
    host: localhost
    port: 3025

nightgals:
  mail:
    # Tests must not open SMTP connections. Codes go to the log instead.
    enabled: false
    from: test@nightgals.local
    from-name: Nightgals
    app-base-url: http://localhost:5173
    support-email: test@nightgals.local

  otp:
    # Sign-in stays a single call in tests. The OTP path has its own test that
    # drives OtpService directly.
    login-required: false
    length: 6
    ttl: PT10M
    max-attempts: 5
    max-resends: 3
    resend-cooldown: PT0S
    max-challenges-per-hour: 100
    purge-cron: "0 15 4 * * *"

  # Publishing stays free, so the existing media tests keep exercising media
  # rules rather than package rules. CreatorPackageTest turns it on itself.
  creator-packages:
    # Publishing stays free, so the older media tests keep testing media rules
    # rather than package rules. CreatorPackageTest turns it on itself.
    enabled: false
    packages:
      PRO:
        label: Pro
        tagline: Standard boost in search
        price-minor: 5000
        duration: P7D
        max-premium-videos: 2
        max-photos: 20
        live-minutes-per-day: 15
        search-priority: 1
      DIAMOND:
        label: Diamond
        tagline: Enhanced profile visibility
        price-minor: 10000
        duration: P7D
        max-premium-videos: 5
        max-photos: 40
        live-minutes-per-day: 45
        search-priority: 2
      BLACK_DIAMOND:
        label: Black Diamond
        tagline: Maximum visibility and promotion
        price-minor: 15000
        duration: P7D
        max-premium-videos: 10
        max-photos: 80
        live-minutes-per-day: 120
        search-priority: 3

  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256-abcdefgh
    issuer: nightgals
    access-token-ttl: PT30M
    refresh-token-ttl: P30D
  app:
    cors-allowed-origins:
      - http://localhost:3000
    minimum-age: 18
    document-hash-pepper: test-pepper
  monetization:
    enabled: true
    currency: XAF
    # The suite drives settlement explicitly, so purchases must stay PENDING
    # until it says otherwise. AutoSettleTest overrides this for itself.
    provider: manual
    # Off by default: most tests predate it and would otherwise pass every
    # paywall for free. TrialTest turns it on for itself.
    free-trial:
    item-pricing:
      default-price-minor: 2000
      min-price-minor: 500
      max-price-minor: 500000
    referral:
      bonus-minor: 5000

  calls:
    enabled: true
    allowed-durations: [5, 10, 15, 30, 45, 60]
    min-price-minor: 500
    max-price-minor: 500000
    max-lead-time: P30D
    min-notice: PT30M

  live:
    reminder-lead-time: PT30M
    reminder-cron: "0 0 4 * * *"

  earnings:
    commission-percent: 30
    # Zero hold so tests can exercise payouts without waiting.
    hold-period: PT0S
    minimum-payout-minor: 1000
    release-cron: "0 0 3 * * *"

  username:
    change-cooldown: P30D

  storage:
    # Filesystem, so the suite needs no object store.
    provider: local
    root-path: ${java.io.tmpdir}/nightgals-test-storage
    max-image-size: 10MB
    max-video-size: 100MB
    allowed-image-types:
      - image/jpeg
      - image/png
    allowed-video-types:
      - video/mp4
    download-url-ttl: PT15M
    kyc-retention: P90D
    purge-cron: "0 0 3 * * *"

logging:
  level:
    org.testcontainers: WARN
