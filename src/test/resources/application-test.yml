spring:
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  # Never reached: nightgals.mail.enabled is false below, so nothing is sent.
  # The host still has to parse, because JavaMailSender is autoconfigured.
  mail:
    host: localhost
    port: 3025

nightgals:
  mail:
    # Tests must not open SMTP connections. Codes go to the log instead.
    enabled: false
    from: test@nightgals.local
    from-name: Nightgals
    app-base-url: http://localhost:5173
    support-email: test@nightgals.local

  otp:
    # Sign-in stays a single call in tests. The OTP path has its own test that
    # drives OtpService directly.
    login-required: false
    length: 6
    ttl: PT10M
    max-attempts: 5
    max-resends: 3
    resend-cooldown: PT0S
    max-challenges-per-hour: 100
    purge-cron: "0 15 4 * * *"

  # Publishing stays free, so the existing media tests keep exercising media
  # rules rather than package rules. CreatorPackageTest turns it on itself.
  creator-packages:
    enabled: false
    packages:
      BRONZE:
        label: Bronze
        tagline: Photos only
        price-minor: 50000
        duration: P30D
        max-photos: 12
        max-videos: 0
      SILVER:
        label: Silver
        tagline: Video only
        price-minor: 100000
        duration: P30D
        max-photos: 0
        max-videos: 6
      GOLD:
        label: Gold
        tagline: Photos and video
        price-minor: 150000
        duration: P30D
        max-photos: 40
        max-videos: 20

  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256-abcdefgh
    issuer: nightgals
    access-token-ttl: PT30M
    refresh-token-ttl: P30D
  app:
    cors-allowed-origins:
      - http://localhost:3000
    minimum-age: 18
    document-hash-pepper: test-pepper
  monetization:
    enabled: true
    currency: KES
    # The suite drives settlement explicitly, so purchases must stay PENDING
    # until it says otherwise. AutoSettleTest overrides this for itself.
    provider: manual
    profile-unlock:
      price-minor: 10000
      duration: P30D
      min-price-minor: 5000
      max-price-minor: 500000
    plans:
      MONTHLY:
        label: 1 month
        price-minor: 90000
        duration: P30D
  earnings:
    commission-percent: 30
    # Zero hold so tests can exercise payouts without waiting.
    hold-period: PT0S
    minimum-payout-minor: 1000
    release-cron: "0 0 3 * * *"

  username:
    change-cooldown: P30D

  storage:
    # Filesystem, so the suite needs no object store.
    provider: local
    root-path: ${java.io.tmpdir}/nightgals-test-storage
    max-image-size: 10MB
    max-video-size: 100MB
    allowed-image-types:
      - image/jpeg
      - image/png
    allowed-video-types:
      - video/mp4
    download-url-ttl: PT15M
    kyc-retention: P90D
    purge-cron: "0 0 3 * * *"

logging:
  level:
    org.testcontainers: WARN
