spring:
  application:
    name: Nightgals

  # Reads .env from the working directory, so `cp .env.example .env` is all a
  # fresh clone needs. Optional: tests, and any deployment that injects real
  # environment variables, run fine without the file. Real environment variables
  # take precedence over anything in it.
  config:
    import: optional:file:.env[.properties]

  # Spring Boot starts compose.yaml automatically on `./mvnw spring-boot:run`
  # and wires the datasource to it. Set enabled=false to point at an external DB.
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop
      file: compose.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/nightgals}
    username: ${DB_USERNAME:nightgals}
    password: ${DB_PASSWORD:nightgals}
    hikari:
      maximum-pool-size: 10
      pool-name: nightgals-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Outbound SMTP. No default credential lives here on purpose: one used to, it
  # was published with the repository, and Google revoked it - which presents as
  # nobody being able to sign in, since sign-in codes go by mail. Set MAIL_* in
  # .env locally and from a secret store in production, and move to a
  # transactional provider (SES, Postmark) before real volume - Gmail rate-limits
  # and will eventually treat this as suspicious.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:manaseschege0@gmail.com}
    password: ${MAIL_PASSWORD:rubp glig qtdn vzsy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Sign-in waits on this send, so it must fail fast rather than hang.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

nightgals:
  jwt:
    # Override in every real environment. Must be >= 32 characters for HS256.
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-0123456789}
    issuer: nightgals
    access-token-ttl: PT30M
    refresh-token-ttl: P30D

  mail:
    # False writes one-time codes to the log instead of sending them, so the
    # sign-in flow is completable on a machine with no outbound SMTP.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${spring.mail.username}}
    from-name: ${MAIL_FROM_NAME:Nightgals}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    support-email: ${SUPPORT_EMAIL:${spring.mail.username}}

  otp:
    # A password alone never signs anyone in. Set false only for local work or
    # as a break-glass measure if the mail provider is down.
    login-required: ${OTP_LOGIN_REQUIRED:true}
    length: 6
    ttl: PT10M
    max-attempts: 5
    max-resends: 3
    resend-cooldown: PT30S
    # Across all purposes. Stops an attacker with a stolen password from opening
    # challenges until one code happens to be guessable.
    max-challenges-per-hour: 10
    purge-cron: "0 15 4 * * *"

  app:
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    minimum-age: 18
    # Mixed into the document-number hash. Rotating this invalidates duplicate
    # detection for existing rows, so set it once, per environment, and keep it.
    document-hash-pepper: ${DOCUMENT_HASH_PEPPER:dev-only-pepper-change-me}

  monetization:
    # Master switch. false makes everything free and every paywall check pass.
    enabled: ${MONETIZATION_ENABLED:true}
    # XAF has no minor unit: 5000 here is five thousand francs, not fifty.
    # com.nightgals.common.Money is what knows that.
    currency: XAF
    # auto   every purchase completes instantly and NOTHING IS COLLECTED. The
    #        happy path, so the product can be walked end to end without an
    #        administrator confirming each payment.
    # manual purchases stay PENDING until a human settles them.
    provider: ${PAYMENT_PROVIDER:auto}
    # Shown when provider is manual. {amount} and {reference} are substituted.
    manual-payment-instructions: >-
      Send {amount} to the Noctyvera till and quote reference {reference}.
      Access is granted once our team confirms receipt.

    # Every premium item is priced by its creator. These are the fallback for an
    # item she never priced, and the bounds she has to stay inside.
    item-pricing:
      default-price-minor: 2000
      # Below this the commission stops covering the payment fee.
      min-price-minor: 500
      # Catches a mistyped extra zero.
      max-price-minor: 500000
      # How long a bought item stays unlocked. Blank means forever, which is the
      # right default for something bought outright rather than rented.
      access-duration:

    # 7 days of full access on every new account: viewers see premium content,
    # creators can publish, without paying for either.
    free-trial: P7D

    referral:
      # Paid to the referrer when the referred account buys its FIRST package.
      bonus-minor: 5000

  # What a creator pays the platform for the right to publish.
  #
  # Weekly, in XAF. Every package covers photos and video; what differs is how
  # much, how long she may broadcast each day, and where she ranks in search.
  creator-packages:
    # False makes publishing free and restores a flat allowance. That is how the
    # test suite runs.
    enabled: ${CREATOR_PACKAGES_ENABLED:true}
    packages:
      PRO:
        label: Pro
        tagline: Standard boost in search
        price-minor: 5000
        duration: P7D
        max-premium-videos: 2
        max-photos: 20
        live-minutes-per-day: 15
        search-priority: 1
      DIAMOND:
        label: Diamond
        tagline: Enhanced profile visibility
        price-minor: 10000
        duration: P7D
        max-premium-videos: 5
        max-photos: 40
        live-minutes-per-day: 45
        search-priority: 2
      BLACK_DIAMOND:
        label: Black Diamond
        tagline: Maximum visibility and promotion
        price-minor: 15000
        duration: P7D
        max-premium-videos: 10
        max-photos: 80
        # Two hours.
        live-minutes-per-day: 120
        search-priority: 3

  # MTN Mobile Money. Only wired in when monetization.provider=momo; every bean
  # in com.nightgals.billing.momo is conditional on it, so leaving the provider
  # as auto or manual costs nothing.
  #
  # Sandbox credentials are self-service at https://momodeveloper.mtn.com:
  # subscribe to Collections for the subscription key, then mint an API user and
  # key over the API. Production credentials come from MTN Cameroon directly,
  # along with the real target-environment name.
  momo:
    base-url: ${MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
    subscription-key: ${MOMO_SUBSCRIPTION_KEY:}
    api-user: ${MOMO_API_USER:}
    api-key: ${MOMO_API_KEY:}
    target-environment: ${MOMO_TARGET_ENVIRONMENT:sandbox}
    # EUR is not a typo. Sandbox rejects everything else, including the XAF this
    # product actually prices in. Switch to XAF at the same time as the
    # target-environment, not before.
    currency: ${MOMO_CURRENCY:EUR}
    # Must be public HTTPS, so blank on a laptop - reconciliation covers it.
    callback-url: ${MOMO_CALLBACK_URL:}
    token-refresh-margin: PT5M
    reconcile-cron: "0 */2 * * * *"
    reconcile-window: PT1H
    # Scaffolding until viewers supply their own number at checkout. Blank this
    # before production or one person is billed for everyone else's purchases.
    sandbox-payer-msisdn: ${MOMO_SANDBOX_PAYER_MSISDN:}

  # Private 1-to-1 video calls.
  calls:
    enabled: ${CALLS_ENABLED:true}
    # The durations a creator may price, in minutes. She picks which to offer.
    allowed-durations: [5, 10, 15, 30, 45, 60]
    # Bounds on what she may charge for one, whatever the length.
    min-price-minor: 500
    max-price-minor: 500000
    # How far ahead a call can be booked, and the least notice it needs.
    max-lead-time: P30D
    min-notice: PT30M

  live:
    # How long before a scheduled broadcast its followers are emailed.
    reminder-lead-time: PT30M
    # Sweep that sends those reminders.
    reminder-cron: "0 */5 * * * *"

  earnings:
    # The platform's cut of every payment. 30 means creators keep 70%.
    commission-percent: 30
    # New earnings stay unpayable for this long, so a refund can reverse them.
    hold-period: P7D
    # Smallest payout that will be processed, in XAF.
    minimum-payout-minor: 10000
    # Hourly sweep releasing earnings whose hold has elapsed.
    release-cron: "0 0 * * * *"

  username:
    # How long a member must wait between handle changes.
    change-cooldown: P30D

  bootstrap:
    # Set BOOTSTRAP_ADMIN_PASSWORD to create the first admin on an empty database.
    # Nothing is created while this is blank.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@nightgals.local}
    # Blank on purpose. A default here means every deployment that forgets to set
    # it gets a superadmin whose password is published in this repository.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  storage:
    # s3 for object storage (AWS in production, MinIO locally - same protocol),
    # local for the filesystem.
    provider: ${STORAGE_PROVIDER:s3}
    # Only read when provider is local.
    root-path: ${STORAGE_ROOT:./var/storage}
    s3:
      bucket: ${S3_BUCKET:nightgals-media}
      region: ${S3_REGION:us-east-1}
      # Blank against real AWS so the SDK resolves the regional endpoint itself.
      # compose.yaml runs MinIO here.
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      # Blank on AWS: credentials should come from an instance or task role, not
      # from configuration. MinIO needs them.
      access-key: ${S3_ACCESS_KEY:nightgals}
      secret-key: ${S3_SECRET_KEY:nightgals-secret}
      # Required by MinIO; harmless on AWS.
      path-style-access: ${S3_PATH_STYLE:true}
      auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}
    max-image-size: 10MB
    max-video-size: 100MB
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
    allowed-video-types:
      - video/mp4
      - video/quicktime
      - video/webm
    download-url-ttl: PT15M
    # How long identity documents are kept after a decision is recorded.
    kyc-retention: P90D
    purge-cron: "0 30 3 * * *"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Spring opens a real SMTP connection on every /actuator/health call, and
    # health backs readiness - so a slow or unreachable mail provider pulls the
    # instance out of the load balancer over a dependency that only sends email.
    # Sign-in already surfaces mail failures on its own, loudly.
    mail:
      enabled: false

logging:
  level:
    com.nightgals: DEBUG
    org.springframework.security: INFO
