services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: nightgals-postgres
    environment:
      POSTGRES_DB: nightgals
      POSTGRES_USER: nightgals
      POSTGRES_PASSWORD: nightgals
    ports:
      - '5433:5432'
    volumes:
      - nightgals-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nightgals -d nightgals']
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for photos, video and identity documents.
  #
  # MinIO speaks the S3 protocol, so this exercises the same code path that runs
  # against AWS in production - only the endpoint and the credentials differ.
  # Deploying means pointing S3_BUCKET at a real bucket and dropping S3_ENDPOINT.
  #
  # Console at http://localhost:9001 (nightgals / nightgals-secret).
  minio:
    image: 'minio/minio:latest'
    container_name: nightgals-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nightgals
      MINIO_ROOT_PASSWORD: nightgals-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - nightgals-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the bucket once, then exits. The app can create it itself
  # (auto-create-bucket), but doing it here means a fresh clone has somewhere to
  # write before the first request rather than at it.
  minio-init:
    image: 'minio/mc:latest'
    container_name: nightgals-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nightgals nightgals-secret &&
      mc mb --ignore-existing local/nightgals-media &&
      echo 'bucket nightgals-media ready'
      "

  # The actual video, which this application deliberately does not handle.
  #
  # Nightgals stores a playbackUrl and decides who may see it; something else has
  # to serve the stream. Owncast is that something for local work: OBS or a phone
  # pushes RTMP in, it transcodes to HLS, and the .m3u8 it publishes is what goes
  # in a session's playbackUrl.
  #
  # Self-hosted rather than a hosted API on purpose. It costs nothing per minute,
  # and no third party's content policy applies to what gets broadcast - which
  # rules out YouTube and Twitch for this platform whatever their free tier says.
  #
  # Admin at http://localhost:8090/admin (admin / abc123). Push RTMP to
  # rtmp://localhost:1935/live with stream key abc123. Both are Owncast defaults
  # and both must be changed before this is reachable from anywhere but a laptop.
  owncast:
    image: 'owncast/owncast:latest'
    container_name: nightgals-owncast
    ports:
      # 8090 outside, because 8080 is the Spring application's.
      - '8090:8080'
      # RTMP ingest - what OBS and mobile broadcast apps push to.
      - '1935:1935'
    volumes:
      - nightgals-owncast:/app/data

volumes:
  nightgals-pgdata:
  nightgals-minio:
  nightgals-owncast:
